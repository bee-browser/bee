# See https://bencher.dev/docs/how-to/github-actions/#base-branch
name: bench

on:
  push:
    branches:
      - main
      - release
    paths-ignore:
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  bench:
    # Skip if this workflow is triggered by dependabot.
    if: ${{ github.actor != 'dependabot[bot]' }}
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt
      - uses: davidlattimore/wild-action@dc926c45399e1842cf81e604f52bdf0ad86a0c09 # 0.10.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .tool-versions
      - name: Codegen
        run: make -j $(nproc) codegen
      - uses: bencherdev/bencher@8d75325c3bc59403a2186a056b472c4f49d42838 # v0.6.12
      - name: Benchmark tests (push)
        run: >-
          bencher run
          --project=bee-browser
          --token="$TOKEN"
          --branch="$REF_NAME"
          --testbed=ubuntu-latest
          --threshold-measure=latency
          --threshold-test=t_test
          --threshold-max-sample-size=64
          --threshold-upper-boundary=0.99
          --thresholds-reset
          --adapter=rust_criterion
          make bench
        env:
          TOKEN: ${{ secrets.BENCHER_API_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
