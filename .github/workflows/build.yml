name: build

on:
  workflow_call:
    inputs:
      runner:
        default: ubuntu-latest
        required: false
        type: string
      rust:
        default: stable
        required: false
        type: string
  workflow_dispatch:
    inputs:
      runner:
        default: ubuntu-latest
        required: false
        type: choice
        options:
          - ubuntu-latest
          - macos-latest
      rust:
        default: stable
        required: false
        type: choice
        options:
          - stable
          - nightly

permissions: {}

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ inputs.rust }}
          components: clippy, rustfmt
      - uses: davidlattimore/wild-action@dc926c45399e1842cf81e604f52bdf0ad86a0c09 # 0.10.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .tool-versions
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: nextest, zizmor
      - name: Codegen
        run: make -j $(nproc) codegen
      - name: Check
        run: make check
      - name: Build
        run: make build
      - name: Build (release)
        run: make build OPTIONS='-r'
      - name: Run tests
        run: make test
      - name: Run tc39/test262
        run: |
          make test262 ARGS=''
          echo 'panics:'
          jq -r '.results[] | select(.status == "panic") | "  " + .file' test262.json
